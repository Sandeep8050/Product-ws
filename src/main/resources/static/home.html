<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Registration</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 40px 20px;
            color: #1e293b;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            color: #2563eb;
            margin-top: 0;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px #dbeafe;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 7px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .save-btn {
            background: #2563eb;
            color: white;
        }

        .save-btn:hover {
            background: #1d4ed8;
        }

        .reset-btn {
            background: #e2e8f0;
            color: #334155;
        }

        .reset-btn:hover {
            background: #cbd5e1;
        }

        .links {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .links a {
            text-decoration: none;
            text-align: center;
            color: #2563eb;
            padding: 10px;
            border: 1px solid #bfdbfe;
            border-radius: 7px;
        }

        .links a:hover {
            background: #eff6ff;
        }

        @media (max-width: 480px) {
            .container {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Product Registration</h1>
        <p class="subtitle">Enter the product details below</p>

        <form action="/api/products" method="post">

            <div class="form-group">
                <label for="id">Product ID</label>
                <input
                    type="number"
                    id="id"
                    name="id"
                    placeholder="Enter product ID"
                    required>
            </div>

            <div class="form-group">
                <label for="pname">Product Name</label>
                <input
                    type="text"
                    id="pname"
                    name="pname"
                    placeholder="Enter product name"
                    required>
            </div>

            <div class="form-group">
                <label for="price">Product Price</label>
                <input
                    type="number"
                    id="price"
                    name="price"
                    step="0.01"
                    min="0"
                    placeholder="Enter product price"
                    required>
            </div>

            <div class="buttons">
                <button type="submit" class="save-btn">
                    Save Product
                </button>

                <button type="reset" class="reset-btn">
                    Reset
                </button>
            </div>

        </form>

        <div class="links">
            <a href="/api/products">View Products List</a>

            <a href="/api/products/search?name=Laptop">
                Search Laptop
            </a>
        </div>

    </div>

</body>
</html>
